[project]
#site_url = "https://www.hookiewookie.com/"
#site_url = "https://steffiland.github.io/hookiewookie/"
site_name = "HookieWookie"
# site_description = "Your project description"
site_author = "Steffi"

copyright = "Copyright &copy; 2026 Steffi"

repo_url = "https://github.com/steffiland/hookiewookie"
repo_name = "steffiland/hookiewookie"
edit_uri = "edit/main/docs/"
docs_dir = "hw-blog"
# we prefer atogenerated navigation
#nav = [
#  { "Get started" = "index.md" },
#  { "Markdown in 5min" = "markdown.md" },
#]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]
use_directory_urls = true # only for pages, not valid for blog/posts

draft_docs = """
drafts/
*.draft.md
*.draft.de.md
"""



[project.plugins.meta] # meta.yml for folder-global frontmatter configuration
[project.plugins.tags]
listings = true

[project.theme]
# variant = "classic"
custom_dir = "overrides" # need for giscus comments
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
  "content.action.edit", # Github Link to edit this page
  "content.action.view", # Github Link to View source of this page
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

