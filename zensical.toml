[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

######################### multilanguage: zensical-i18n -this may change during next months 20261025

[project.plugins.i18n]
docs_structure = "suffix"     # default; or "folder"
fallback_to_default = true    # use pages of the default language when missing
reconfigure_theme = true      # language selector and untranslated page notice
translate_admonitions = true  # built-in translations of default admonition titles

[[project.plugins.i18n.languages]]
locale = "en"
name = "English"
default = true

[[project.plugins.i18n.languages]]
locale = "de"
name = "Deutsch"
#site_name = "Documentação"

[project.plugins.i18n.languages.nav_translations]
#"Get started" = "Comece aqui"
#"Guide" = "Guia"

############################ tags

[project.extra.tags]
# assign identifiers to tags
recipe = "recipe"
recipes = "recipe"
Rezept = "recipe"

[project.theme.icon.tag]
# assign icons to tag identifiers
default = "lucide/hash"
recipe = "lucide/utensils"

############################# blog

[project.plugins.blog]
# see https://squidfunk.github.io/mkdocs-material/plugins/blog/
post_url_date_format =  "yyyy"

# enable RSS and limit it to blog posts 
[project.plugins.rss]
match_path = "blog/posts/*"
use_git = true   # true by default; git fallback when meta key is missing  
  
[plugins.rss.date_from_meta]  
as_creation = "date.created"   # front matter first  
as_update = "date.updated"     # front matter first, git fallback via use_git

