name: Zensical mkdocs i18n
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    #if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '#deploy')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      #- uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2       
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Install dependencies with uv
        run: |
          uv venv
          uv pip install -r requirements.txt
      - name: Build Nikola Site
        run: uv run zensical-i18n build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
